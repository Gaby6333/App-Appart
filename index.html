<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f6444" />
    <title>App Appart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="header-top">
          <h1 id="titre">App Appart</h1>
          <div class="header-actions">
            <button id="theme-toggle" class="icon-btn" type="button">🌙</button>
            <button id="nom-btn" class="icon-btn" type="button">Profil</button>
          </div>
        </div>
      </div>
      <div class="content">
        <p class="empty" id="loading">Connexion...</p>
        <section id="section-checklist" class="section"></section>
        <section id="section-taches" class="section"></section>
        <section id="section-repas" class="section"></section>
        <section id="section-epicerie" class="section"></section>
        <section id="section-depenses" class="section"></section>
      </div>
      <div class="nav" id="nav-wrap" style="display: none">
        <div class="nav-inner" id="nav"></div>
      </div>
    </div>

    <div class="overlay" id="profil-overlay" style="display: none">
      <div class="card profil-card">
        <h2>Comment tu t'appelles?</h2>
        <form id="profil-form">
          <input id="profil-nom" placeholder="Ton nom" autocomplete="off" />
          <button type="submit">OK</button>
        </form>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
